#port=0  # disable dns
interface=eth0
bind-interfaces
local=/lab.internal/
address=/matchbox.lab.internal/192.168.8.2
domain=lab.internal
#domain-needed


# Enable dhcp
dhcp-range=192.168.8.16,192.168.8.255,255.255.255.0,1h
dhcp-host=A8:A1:59:65:8A:CA,192.168.8.3,node-a,1h
dhcp-host=A8:A1:59:65:8C:AC,192.168.8.4,node-b,1h
dhcp-host=A8:A1:59:65:8E:05,192.168.8.5,node-c,1h
dhcp-option=option:router,192.168.8.1
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# ProxyDHCP
#dhcp-no-override
#dhcp-range=192.168.8.255,proxy

# Enable tftp for pxe boot
enable-tftp
tftp-root=/var/lib/tftpboot

# PXE Boot
# https://matchbox.psdn.io/network-setup/#pxe-enabled-dhcp
# Legacy PXE
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:bios,undionly.kpxe

# UEFI
dhcp-match=set:efi32,option:client-arch,6
dhcp-boot=tag:efi32,ipxe.efi
dhcp-match=set:efibc,option:client-arch,7
dhcp-boot=tag:efibc,ipxe.efi
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:efi64,ipxe.efi

# iPXE - chainload to matchbox ipxe boot script
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:ipxe,http://matchbox.lab.internal:8080/boot.ipxe

#log-queries
#log-dhcp
